<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bảng lương &amp; P&amp;L theo timesheet — OmniKey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wght@500;600&family=Outfit:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap&subset=latin,latin-ext,vietnamese" rel="stylesheet">
<style>
:root{
  --ink:#16201C; --muted:#6a746e; --line:#e3e8e4; --bg:#f4f6f4; --panel:#fff;
  --accent:#0B5D4B; --neg:#B3402E; --warn:#8a5a12; --warnbg:#fff9e8; --soft:#eaf3ef;
  --serif:'Noto Serif Display',Georgia,serif;
  --sans:'Outfit',system-ui,sans-serif;
  --mono:'DM Mono',ui-monospace,monospace;
  --c1:#0B5D4B; --c2:#2b7d69; --c3:#4d9c88; --c4:#74baa8; --c5:#9dd6c7; --c6:#c2e5da; --c0:#b9c2bd;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--mono)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

/* ---------- TOP BAR ---------- */
#top{position:sticky;top:0;z-index:60;background:var(--panel);border-bottom:1px solid var(--line);
     display:flex;align-items:center;gap:12px;padding:8px 14px;flex-wrap:wrap}
#top .id{display:flex;flex-direction:column;gap:1px;min-width:0}
#top .id h1{font-family:var(--serif);font-weight:600;font-size:16px;margin:0;letter-spacing:-.01em}
#top .id .stamp{font-family:var(--mono);font-size:9.5px;color:var(--muted)}
.badge{font-family:var(--mono);font-size:9.5px;padding:2px 6px;border:1px solid var(--line);border-radius:4px;color:var(--muted);background:var(--bg)}
#top .sp{flex:1}
#pill{font-size:11.5px;padding:3px 10px;border-radius:999px;opacity:0;transition:opacity .2s;white-space:nowrap;font-family:var(--mono)}
#pill.on{opacity:1}
#pill.ok{background:var(--soft);color:var(--accent)}
#pill.warn{background:var(--warnbg);color:var(--warn)}
#pill.err{background:#fbeeeb;color:var(--neg)}

/* ---------- BUTTONS: đúng 3 loại ---------- */
.btn{font:500 12px var(--sans);border:1px solid var(--line);background:#fff;color:var(--ink);
     border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#c9d2cc;background:#fafbfa}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#0a4f40}
.btn.danger{color:var(--neg);border-color:#eccfc9}
.btn.sm{font-size:11px;padding:3px 7px}

/* ---------- SEGMENTED: đúng 1 kiểu toàn tool ---------- */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.seg button{font:500 11.5px var(--sans);border:0;background:#fff;color:var(--muted);padding:4px 9px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.active{background:var(--accent);color:#fff}

/* ---------- TABS ---------- */
#tabs{display:flex;gap:2px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:47px;z-index:55;overflow-x:auto}
#tabs button{font:500 12.5px var(--sans);border:1px solid transparent;border-bottom:0;background:transparent;color:var(--muted);
   padding:7px 12px;cursor:pointer;border-radius:7px 7px 0 0;white-space:nowrap;margin-bottom:-1px}
#tabs button.active{background:var(--bg);border-color:var(--line);color:var(--ink);font-weight:600}

/* ---------- SHELL ---------- */
#shell{display:flex;align-items:stretch;min-height:calc(100vh - 78px)}
#left{width:330px;flex:0 0 auto;background:var(--panel);border-right:1px solid var(--line);padding:12px;overflow:auto}
#rz{width:5px;flex:0 0 auto;cursor:col-resize;background:transparent;border-right:1px solid var(--line)}
#rz:hover{background:var(--soft)}
#main{flex:1;min-width:0;padding:14px 16px 60px}

.fgroup{margin-bottom:12px}
.flabel{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.06em;margin-bottom:4px}
input,select,textarea{font:400 12.5px var(--sans);border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:#fff;color:var(--ink);width:100%;outline:none}
input:focus,select:focus,textarea:focus,.btn:focus-visible,.seg button:focus-visible,#tabs button:focus-visible{
  border-color:var(--accent);box-shadow:0 0 0 3px rgba(11,93,75,.18)}
.chkline{display:flex;align-items:center;gap:6px;font-size:12px;padding:2px 0}
.chkline input{width:auto}

h2.sec{font-family:var(--serif);font-size:17px;font-weight:600;margin:0 0 3px}
p.hint{font-size:11.5px;color:var(--muted);margin:0 0 12px;max-width:78ch}
.subnav{display:flex;gap:2px;margin:0 0 12px}

/* ---------- CARDS / KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.kpi .k{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.04em}
.kpi .v{font-family:var(--mono);font-size:17px;font-weight:500;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:10.5px;color:var(--muted);margin-top:1px}
.kpi.acc .v{color:var(--accent)}
.kpi.neg .v{color:var(--neg)}
.kpi.wr{background:var(--warnbg);border-color:#efe0b8}
.kpi.wr .v{color:var(--warn);font-size:14px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.card h3{font-size:13px;font-weight:600;margin:0 0 8px}
.note{border-left:3px solid var(--warn);background:var(--warnbg);padding:9px 12px;border-radius:0 6px 6px 0;font-size:12px;margin-bottom:12px}
.note.ok{border-left-color:var(--accent);background:var(--soft)}
.note b{font-weight:600}

/* ---------- TABLES ---------- */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{position:sticky;top:0;background:var(--panel);z-index:2;text-align:left;font-family:var(--mono);font-size:9.5px;
   font-weight:400;color:var(--muted);letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th.num{text-align:right}
td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover{background:#fafbfa;cursor:default}
tbody tr.clk{cursor:pointer}
tbody tr.dim{opacity:.22}
tbody tr.sel{background:var(--soft)}
tr.grp td{background:#f0f3f1;font-weight:600}
tr.tot td{background:var(--soft);font-weight:600;border-top:1px solid #cfded7}
.twrap{max-height:62vh;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}

.chip{display:inline-block;font-family:var(--mono);font-size:9.5px;padding:1px 5px;border-radius:3px;background:#eef1ef;color:var(--muted);margin-right:3px;white-space:nowrap}
.chip.acc{background:var(--soft);color:var(--accent)}
.chip.wr{background:var(--warnbg);color:var(--warn)}
.chip.ng{background:#fbeeeb;color:var(--neg)}
.miss{font-family:var(--mono);font-size:11px;color:var(--warn)}

.bar{height:7px;background:#eef1ef;border-radius:3px;overflow:hidden;display:flex;min-width:60px}
.bar i{display:block;height:100%}
.lg{display:flex;flex-wrap:wrap;gap:8px;font-size:10.5px;color:var(--muted);margin-top:6px}
.lg span{display:flex;align-items:center;gap:4px}
.lg i{width:9px;height:9px;border-radius:2px;display:inline-block}

.nbtns{display:none;gap:3px}
tbody tr:hover .nbtns{display:inline-flex}

svg text{font-family:var(--mono);font-size:9px;fill:var(--muted)}

@media (max-width:900px){
  #shell{flex-direction:column}
  #left{width:auto!important;border-right:0;border-bottom:1px solid var(--line)}
  #rz{display:none}
  .twrap{max-height:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="top">
  <div class="id">
    <h1>Bảng lương &amp; P&amp;L theo timesheet</h1>
    <div class="stamp"><span data-stamp></span></div>
  </div>
  <span class="badge" data-ver></span>
  <span class="badge" id="ctxBadge">kỳ 08-2026</span>
  <div class="sp"></div>
  <span id="pill"></span>
  <button class="btn" id="btnUndo" onclick="undo()">↩ Undo (0)</button>
  <button class="btn" id="btnModel" onclick="exportModel()" title="Toàn bộ dữ liệu + cấu hình + bản lưu. IMPORT NGƯỢC ĐƯỢC.">💾 Full model (backup)</button>
  <button class="btn primary" onclick="exportSchema()" title="Bảng phẳng các dòng hiệu lực + P&L đã chốt, có version + hash. KHÔNG import ngược được.">📤 Schema P&amp;L (cho hệ khác)</button>
</div>

<div id="tabs">
  <button data-tab="1" class="active">1. Tổng quan P&amp;L</button>
  <button data-tab="2">2. Nhân sự</button>
  <button data-tab="3">3. Báo cáo nhân sự 360°</button>
  <button data-tab="4">4. Khách hàng &amp; công việc</button>
  <button data-tab="5">5. Báo cáo khách hàng 360°</button>
  <button data-tab="6">6. Theo ngày</button>
  <button data-tab="7">7. Cấu hình doanh thu</button>
  <button data-tab="8">8. Đối chiếu</button>
</div>

<div id="shell">
  <div id="left">
    <div class="fgroup">
      <div class="flabel">CƠ SỞ CHI PHÍ</div>
      <div class="seg" id="segBasis">
        <button data-b="payroll" class="active">Payroll (tiền thật)</button>
        <button data-b="timesheet">Timesheet (đơn giá)</button>
      </div>
      <div style="font-size:10.5px;color:var(--muted);margin-top:4px" id="basisNote"></div>
    </div>
    <div class="fgroup">
      <div class="flabel">TÌM TRONG NỘI DUNG TASK</div>
      <input id="fq" placeholder="ví dụ: báo cáo, IBS, mail…" oninput="onFilter()">
    </div>
    <div class="fgroup">
      <div class="flabel">NHÂN SỰ</div><div id="fPeople"></div>
    </div>
    <div class="fgroup">
      <div class="flabel">KHÁCH HÀNG</div><div id="fClients"></div>
    </div>
    <div class="fgroup">
      <div class="flabel">PHÁP NHÂN</div><div id="fEnt"></div>
    </div>
    <div class="fgroup">
      <div class="flabel">KHOẢNG NGÀY</div>
      <div style="display:flex;gap:6px">
        <input type="date" id="fd1" onchange="onFilter()"><input type="date" id="fd2" onchange="onFilter()">
      </div>
    </div>
    <div class="fgroup">
      <div class="flabel">DÒNG KHÔNG KHỚP FILTER</div>
      <div class="seg" id="segDim"><button data-d="dim" class="active">Làm mờ</button><button data-d="hide">Ẩn hẳn</button></div>
    </div>
    <div class="fgroup"><button class="btn sm" onclick="resetFilter()">Xoá bộ lọc</button>
      <span class="chip" id="fCount"></span></div>
    <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
    <div class="flabel">CHI TIẾT</div>
    <div id="detail" style="font-size:12px;color:var(--muted)">Bấm một dòng ở bảng bên phải để xem chi tiết tại đây.</div>
  </div>
  <div id="rz"></div>
  <div id="main"></div>
</div>

const nf=new Intl.NumberFormat('vi-VN');

/* ============================================================
   EFFECTIVE — nguồn DUY NHẤT cho mọi bảng, export, hash
   ============================================================ */
function effective(){
  const basis=cfg.basis;
  // tổng giờ timesheet theo người → khoá phân bổ
  const hByName={}; DATA.ts.forEach(r=>hByName[r.name]=(hByName[r.name]||0)+r.h);

  const lines = DATA.ts.map(r=>{
    let cost, warn=null;
    if(basis==='timesheet'){ cost = r.h*r.rate; }
    else{
      const p=PAY[r.name];
      if(p && hByName[r.name]>0){ cost = p.salary * (r.h/hByName[r.name]); }
      else { cost = r.h*r.rate; warn='no-payroll'; }
    }
    const cc=cfg.clients[r.kh]||{bill:'fixed'};
    return {...r, grp:taskGroup(r.task), cost, bucket:(cc.bill==='internal'?'absorb':'charge'), warn};
  });

  // nhân sự lương cố định (không log timesheet) → theo cấu hình phân bổ
  const fixedLines = FIXED.map(p=>{
    const to=cfg.fixedAlloc[p.name]||'OVERHEAD';
    const isC = to!=='OVERHEAD';
    return {id:'f_'+p.name, name:p.name, kh:(isC?to:'(Chi phí chung)'), ct:'OmniKey',
      proj:'Lương cố định', grp:'Lương cố định', task:p.role||'Lương cố định tháng',
      h:0, rate:null, cost:p.salary, date:null,
      bucket:(isC && (cfg.clients[to]||{}).bill!=='internal')?'charge':'absorb', fixed:true};
  });

  // chi phí ngoài lương gộp
  const other=[];
  const bh = DATA.payroll.reduce((s,p)=>s+(p.bh_cty||0),0);
  const ai = DATA.payroll.reduce((s,p)=>s+(p.other||0),0);
  if(cfg.incBhCty && bh) other.push({key:'bh', label:'BHXH/BHYT/BHTN phần công ty (21,5%)', amt:bh, src:'Payroll cột AJ'});
  if(cfg.incAi  && ai) other.push({key:'ai', label:'Hỗ trợ AI (Quỳnh, Quang)', amt:ai, src:'Payroll cột P'});

  return {lines, fixedLines, other, hByName};
}

function passFilter(r){
  if(filt.q){ const q=filt.q.toLowerCase();
    if(!((r.task||'').toLowerCase().includes(q)||(r.proj||'').toLowerCase().includes(q))) return false; }
  if(filt.people.size && !filt.people.has(r.name)) return false;
  if(filt.clients.size && !filt.clients.has(r.kh)) return false;
  if(filt.ent.size && !filt.ent.has(r.ct)) return false;
  if(filt.d1 && r.date && r.date<filt.d1) return false;
  if(filt.d2 && r.date && r.date>filt.d2) return false;
  return true;
}
const filterOn=()=>!!(filt.q||filt.people.size||filt.clients.size||filt.ent.size||filt.d1||filt.d2);

  all.forEach(l=>{
    const e=l.ct; ent[e]=ent[e]||{rev:0,charge:0,absorb:0,revMissing:[]};
    if(l.bucket==='charge') ent[e].charge+=l.cost; else ent[e].absorb+=l.cost;
    const k=l.kh; byClient[k]=byClient[k]||{h:0,charge:0,absorb:0,ct:l.ct};
    byClient[k].h+=l.h||0;
    if(l.bucket==='charge') byClient[k].charge+=l.cost; else byClient[k].absorb+=l.cost;
  });
  E.other.forEach(o=>{ ent['OmniKey'].absorb+=o.amt; });

  CLIENTS.forEach(k=>{
    const c=cfg.clients[k]||{}; const e=(byClient[k]||{}).ct||'OmniKey';
    if(c.bill!=='internal'){
      if(c.rev!==null && c.rev!==undefined && c.rev!=='') ent[e].rev+=Number(c.rev);
      else ent[e].revMissing.push(k);
    }
  });
  const tot={rev:0,charge:0,absorb:0,revMissing:[]};
  Object.values(ent).forEach(v=>{tot.rev+=v.rev;tot.charge+=v.charge;tot.absorb+=v.absorb;tot.revMissing.push(...v.revMissing);});
  return {E,ent,byClient,tot};
}

/* ============================================================
   HASH (FNV-1a) — phát hiện drift cấu hình
   ============================================================ */
function hash(o){ const s=JSON.stringify(o); let h1=0x811c9dc5,h2=0x01000193;
  for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);
    h1=(h1^c)>>>0; h1=Math.imul(h1,16777619)>>>0;
    h2=(h2+c*(i+1))>>>0; h2=Math.imul(h2,2246822519)>>>0;}
  return (h1.toString(16).padStart(8,'0')+h2.toString(16).padStart(8,'0')).slice(0,12);
}
const cfgHash=()=>hash({c:cfg.clients,f:cfg.fixedAlloc,b:cfg.basis,o:[cfg.incBhCty,cfg.incAi,cfg.allocOverhead]});

/* ============================================================

function analysis(){
  const P=pnl();
  const all=[...P.E.lines,...P.E.fixedLines];
  const chargeByClient={}, chargeByPerson={};
  all.forEach(l=>{ if(l.bucket==='charge'){
    chargeByClient[l.kh]=(chargeByClient[l.kh]||0)+l.cost;
    chargeByPerson[l.name]=(chargeByPerson[l.name]||0)+l.cost; } });
  const internalLineCost=P.E.lines.filter(l=>l.bucket==='absorb').reduce((s,l)=>s+l.cost,0);
  const overheadCommon=P.tot.absorb-internalLineCost;   // lương cố định chung + BH cty + hỗ trợ AI
  return {P,all,chargeByClient,chargeByPerson,internalLineCost,overheadCommon};
}
const revOf=k=>{const c=cfg.clients[k]||{};return (c.rev===null||c.rev===''||c.rev===undefined)?null:Number(c.rev);};

/* Doanh thu quy về một nhân sự = Σ (doanh thu khách × tỉ trọng chi phí charge của người đó trong khách đó) */
function personRevenue(n,A){
  const byC={}; A.all.filter(l=>l.name===n&&l.bucket==='charge').forEach(l=>byC[l.kh]=(byC[l.kh]||0)+l.cost);
  let rev=0; const missing=[];
  Object.entries(byC).forEach(([k,c])=>{ const r=revOf(k);
    if(r===null) missing.push(k); else rev+=r*(A.chargeByClient[k]?c/A.chargeByClient[k]:0); });
  return {rev,missing,byC};
}

/* Chi phí đã gánh đủ (fully loaded) — MỘT nguồn duy nhất cho cả dashboard lẫn bảng xếp hạng.
   Nguyên tắc chống đếm hai lần: bên nào là nguồn của pool chi phí chung thì khi bật phân bổ
   phần của chính nó về 0, vì đã được rải sang các bên còn lại. */
function clientCost(x,A){
  const cc=cfg.clients[x]||{}, ls=A.all.filter(l=>l.kh===x);
  const direct=ls.reduce((s,l)=>s+l.cost,0);
  const charge=ls.filter(l=>l.bucket==='charge').reduce((s,l)=>s+l.cost,0);
  const alloc=(cfg.allocOverhead&&cc.bill!=='internal'&&A.P.tot.charge)?A.P.tot.absorb*(charge/A.P.tot.charge):0;
  const loaded=cfg.allocOverhead?(cc.bill==='internal'?0:direct+alloc):direct;
  return {ls,direct,charge,absorbOwn:direct-charge,alloc,loaded,
          hours:ls.reduce((s,l)=>s+(l.h||0),0),internal:cc.bill==='internal'};
}
function personCost(n,A){
  const ls=A.all.filter(l=>l.name===n);
  const direct=ls.reduce((s,l)=>s+l.cost,0);
  const charge=ls.filter(l=>l.bucket==='charge').reduce((s,l)=>s+l.cost,0);
  const isOv=ls.length>0&&ls.every(l=>l.fixed)&&charge===0;
  const alloc=(cfg.allocOverhead&&!isOv&&A.P.tot.charge)?A.overheadCommon*(charge/A.P.tot.charge):0;
  const loaded=cfg.allocOverhead?(isOv?0:direct+alloc):direct;
  return {ls,direct,charge,absorbOwn:direct-charge,alloc,loaded,isOv,
          hours:ls.reduce((s,l)=>s+(l.h||0),0)};
}

function kpis(items){ return `<div class="kpis">`+items.map(i=>
  `<div class="kpi ${i.cls||''}"><div class="k">${i.k}</div><div class="v">${i.v}</div><div class="s">${i.s||''}</div></div>`).join('')+`</div>`; }

function dayChart(ls,color){
  const d={}; ls.forEach(l=>{ if(l.date) d[l.date]=(d[l.date]||0)+(l.h||0); });
  const ds=Object.keys(d).sort(); if(!ds.length) return '<div style="font-size:11.5px;color:var(--muted)">Không có dòng nào gắn ngày.</div>';
  const mx=Math.max(...ds.map(k=>d[k])), W=Math.max(560,ds.length*24), H=110, pad=22, bw=(W-pad*2)/ds.length;
  let b=''; ds.forEach((k,i)=>{ const hh=(H-34)*(d[k]/mx), x=pad+i*bw;
    b+=`<rect x="${x+2}" y="${H-20-hh}" width="${bw-4}" height="${Math.max(hh,1)}" fill="${color||'var(--c2)'}"></rect>`;
    b+=`<text x="${x+bw/2}" y="${H-7}" text-anchor="middle">${k.split('-')[2]}</text>`; });
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:100%">
    <line x1="${pad}" y1="${H-20}" x2="${W-pad}" y2="${H-20}" stroke="var(--line)"></line>${b}
    <text x="${pad}" y="12">cao nhất ${fh(mx)} h/ngày</text></svg></div>`;
}
function miniTable(title,map,tot,extra){
  const rows=Object.entries(map).sort((a,b)=>b[1].cost-a[1].cost);
  const mx=rows.length?rows[0][1].cost:1;
  return `<div class="card"><h3>${title}</h3><div class="twrap"><table><thead><tr>
    <th>${extra||'Hạng mục'}</th><th class="num">Giờ</th><th class="num">Chi phí</th><th class="num">Tỉ trọng</th><th style="min-width:110px"></th></tr></thead><tbody>
    ${rows.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${fh(v.h)}</td><td class="num">${f0(v.cost)}</td>
      <td class="num">${fp(tot?v.cost/tot*100:0)}</td>
      <td><div class="bar"><i style="width:${v.cost/mx*100}%;background:var(--c3)"></i></div></td></tr>`).join('')}
    <tr class="tot"><td>TỔNG</td><td class="num">${fh(rows.reduce((s,r)=>s+r[1].h,0))}</td>
      <td class="num">${f0(rows.reduce((s,r)=>s+r[1].cost,0))}</td><td class="num">100%</td><td></td></tr>
    </tbody></table></div></div>`;
}
function groupBy(ls,key){ const m={}; ls.forEach(l=>{const k=l[key]||'(trống)';m[k]=m[k]||{h:0,cost:0,n:0};m[k].h+=l.h||0;m[k].cost+=l.cost;m[k].n++;}); return m; }

function parseTask(t){
  const ln=String(t||'').split('\n').map(s=>s.trim()).filter(Boolean);
  return {head:ln[0]||'(không có mô tả)', items:ln.slice(1).map(s=>s.replace(/^[-•*\u2013]\s*/,''))};
}
function deliverTable(ls,showClient){
  const key=l=>(showClient?l.kh+' › ':'')+l.proj;
  const g={}; ls.forEach(l=>{const k=key(l);g[k]=g[k]||[];g[k].push(l);});

  Object.keys(g).sort().forEach(k=>{

    h+=`<tr class="grp"><td colspan="3">${esc(k)}</td><td class="num">${fh(sh)}</td><td class="num">${f0(sc)}</td></tr>`;

        <div style="margin-top:2px"><span class="chip wr">${esc(l.grp)}</span></div></td>
        <td style="font-size:11.5px">${esc(l.name)}</td><td class="num">${fh(l.h)}</td><td class="num">${f0(l.cost)}</td></tr>`; });
  });
  const th=ls.reduce((s,l)=>s+l.h,0), tc=ls.reduce((s,l)=>s+l.cost,0);
  h+=`<tr class="tot"><td colspan="3">TỔNG ${ls.length} hạng mục</td><td class="num">${fh(th)}</td><td class="num">${f0(tc)}</td></tr></tbody></table></div>`;

/* ---------- CSV ---------- */
function csv(rows,name){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""').replace(/\n/g,' | ')+'"';
  const b=new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();URL.revokeObjectURL(a.href);
}
function csvDeliverables(client){
  const E=effective();
  const ls=E.lines.filter(l=>client?l.kh===client:passFilter(l));
  const rows=[['Ngay','Khach hang','Phap nhan','Du an','Da giao gi','Dau muc con','Nguoi thuc hien','Gio','Thanh tien']];
  ls.sort((a,b)=>(a.kh+a.proj+(a.date||'')).localeCompare(b.kh+b.proj+(b.date||''))).forEach(l=>{
    const t=parseTask(l.task);
    rows.push([l.date?l.date.split('-').reverse().join('/'):'',l.kh,l.ct,l.proj,t.head,t.items.join(' | '),l.name,l.h,Math.round(l.cost)]);});
  rows.push(['','','','','TONG','','',ls.reduce((s,l)=>s+l.h,0),Math.round(ls.reduce((s,l)=>s+l.cost,0))]);
  csv(rows,'bang_ke_giao_nhan_'+(client?client.replace(/[^\w]+/g,'_'):'loc')+'_082026.csv');
  pill('Đã xuất bảng kê CSV — file phẳng, không import ngược được','warn');
}
function csvLines(){
  const E=effective(), ls=E.lines.filter(passFilter);
  const rows=[['Ngay','Nhan su','Khach hang','Phap nhan','Du an','Nhom task','Noi dung task','Gio','Don gia','Chi phi','Phan loai']];
  ls.forEach(l=>rows.push([l.date?l.date.split('-').reverse().join('/'):'',l.name,l.kh,l.ct,l.proj,l.grp,l.task,l.h,l.rate,Math.round(l.cost),l.bucket==='charge'?'Charge':'Tu chiu']));
  csv(rows,'chi_tiet_timesheet_082026.csv');
  pill('Đã xuất CSV chi tiết timesheet','warn');
}

  const hByName={}; DATA.ts.forEach(r=>hByName[r.name]=(hByName[r.name]||0)+r.h);
  const cByName={}; DATA.ts.forEach(r=>cByName[r.name]=(cByName[r.name]||0)+r.amt);

  let h=`<h2 class="sec">Đối chiếu theo chuỗi</h2>
  <p class="hint">Đối chiếu là một <b>chuỗi</b>, không phải một điểm: Timesheet → Payroll → Hoá đơn. Lệch ở khâu nào thì chỉ ra ở khâu đó.</p>`;

  // 1. TS vs Payroll
  let dH=0,dC=0; const rr=[];
  Object.keys(hByName).forEach(n=>{ const p=PAY[n]||{};
    const ph=p.units||0, pc=p.salary||0;
    rr.push({n,tsH:hByName[n],tsC:cByName[n],pH:ph,pC:pc,dH:hByName[n]-ph,dC:cByName[n]-pc}); });
  DATA.payroll.filter(p=>p.form==='Man hour'&&!hByName[p.name]).forEach(p=>
    rr.push({n:p.name,tsH:0,tsC:0,pH:p.units||0,pC:p.salary||0,dH:-(p.units||0),dC:-(p.salary||0)}));
  rr.forEach(r=>{dH+=r.dH;dC+=r.dC;});

  h+=`<div class="note ${Math.abs(dC)>0?'':'ok'}">${Math.abs(dC)>0
    ? `Timesheet ghi <b>${fh(dH)} giờ</b> nhiều hơn số giờ Payroll đã trả, tương đương <b>${f0(dC)} đ</b> chưa vào bảng lương. Cần chốt: giờ thừa là <i>chưa duyệt</i>, <i>trả kỳ sau</i>, hay <i>timesheet ghi sai</i>.`
    : `Timesheet khớp Payroll.`}</div>`;

  h+=`<div class="card"><h3>1 · Timesheet ↔ Payroll (theo người)</h3><div class="twrap"><table><thead><tr>
    <th>Nhân sự</th><th class="num">Giờ timesheet</th><th class="num">Giờ payroll</th><th class="num">Lệch giờ</th>
    <th class="num">Tiền theo timesheet</th><th class="num">Lương payroll</th><th class="num">Lệch tiền</th></tr></thead><tbody>`;
  rr.sort((a,b)=>Math.abs(b.dC)-Math.abs(a.dC)).forEach(r=>{
    h+=`<tr><td><b>${esc(r.n)}</b></td><td class="num">${fh(r.tsH)}</td><td class="num">${fh(r.pH)}</td>
      <td class="num" style="color:${r.dH?'var(--neg)':'var(--muted)'}">${r.dH?fh(r.dH):'0'}</td>
      <td class="num">${f0(r.tsC)}</td><td class="num">${f0(r.pC)}</td>
      <td class="num" style="color:${r.dC?'var(--neg)':'var(--muted)'}">${r.dC?f0(r.dC):'0'}</td></tr>`;});
  h+=`<tr class="tot"><td>TỔNG</td><td class="num">${fh(rr.reduce((s,r)=>s+r.tsH,0))}</td><td class="num">${fh(rr.reduce((s,r)=>s+r.pH,0))}</td>
    <td class="num">${fh(dH)}</td><td class="num">${f0(rr.reduce((s,r)=>s+r.tsC,0))}</td>
    <td class="num">${f0(rr.reduce((s,r)=>s+r.pC,0))}</td><td class="num">${f0(dC)}</td></tr></tbody></table></div></div>`;

  // 2. Rabity invoice vs timesheet
  const rab={}; DATA.ts.filter(r=>r.kh==='Rabity').forEach(r=>rab[r.name]=(rab[r.name]||0)+r.h);
  h+=`<div class="card"><h3>2 · Hoá đơn Rabity ↔ giờ timesheet cho Rabity</h3><div class="twrap"><table><thead><tr>
    <th>Nhân sự</th><th class="num">Giờ trên hoá đơn</th><th class="num">Giờ timesheet</th><th class="num">Lệch</th>
    <th class="num">Tiền chưa VAT</th></tr></thead><tbody>`;
  let ok=true;
  DATA.invRabity.filter(i=>i.form==='Man hour').forEach(i=>{
    const t=rab[i.name]||0, d=(i.units||0)-t; if(d)ok=false;
    h+=`<tr class="${(i.units||t)?'':'dim'}"><td>${esc(i.name)}</td><td class="num">${fh(i.units)}</td><td class="num">${fh(t)}</td>
      <td class="num" style="color:${d?'var(--neg)':'var(--muted)'}">${d?fh(d):'0'}</td><td class="num">${f0(i.pre)}</td></tr>`;});
  DATA.invRabity.filter(i=>i.form!=='Man hour').forEach(i=>{
    h+=`<tr><td>${esc(i.name)}</td><td class="num">—</td><td class="num">—</td><td class="num">—</td><td class="num">${f0(i.pre)}</td></tr>`;});
  const totPre=DATA.invRabity.reduce((s,i)=>s+i.pre,0);
  h+=`<tr class="tot"><td>TỔNG HOÁ ĐƠN (chưa VAT)</td><td class="num">—</td><td class="num">—</td><td class="num">—</td><td class="num">${f0(totPre)}</td></tr></tbody></table></div>
   <div class="note ${ok?'ok':''}" style="margin-top:10px">${ok?'Giờ trên hoá đơn khớp tuyệt đối với timesheet.':'Giờ hoá đơn lệch timesheet — kiểm tra lại.'}
   Đơn giá xuất hoá đơn <b>bằng đúng đơn giá lương</b>, và 60.000.000 lương cố định Giám đốc được xuất nguyên vẹn ⇒ tính theo <b>cơ sở Timesheet, biên lợi nhuận Rabity = 0</b>. Theo cơ sở Payroll biên nhích lên chút vì phần giờ ghi thừa chưa được trả lương — chênh lệch đó không phải lợi nhuận thật.</div></div>`;

  // 3. Insurance check
  const bp=PAY['Lê Thị Búp'];
  if(bp){ const d=(bp.bh_nld||0)-553350;
    h+=`<div class="card"><h3>3 · Kiểm tra bảo hiểm</h3><div class="twrap"><table><thead><tr>
      <th>Chỉ tiêu</th><th class="num">Giá trị</th><th>Ghi chú</th></tr></thead><tbody>
      <tr><td>Giảm trừ BHXH người lao động (cột T)</td><td class="num">${f0(553350)}</td><td>Payroll cột T</td></tr>
      <tr><td>Cộng 10,5% tính trên mức đóng (cột AF)</td><td class="num">${f0(bp.bh_nld)}</td><td>5.310.000 × 10,5%</td></tr>
      <tr class="tot"><td>Lệch</td><td class="num" style="color:var(--neg)">${f0(d)}</td><td>Cần kế toán xác nhận cột nào đúng</td></tr>
      </tbody></table></div></div>`; }

  // 4. Cost pool
  const gross=DATA.payroll.reduce((s,p)=>s+p.gross,0), bh=DATA.payroll.reduce((s,p)=>s+(p.bh_cty||0),0);
  h+=`<div class="card"><h3>4 · Tổng chi phí nhân sự công ty phải chịu</h3><div class="twrap"><table><tbody>
    <tr><td>Lương gộp toàn bộ (Payroll cột Q)</td><td class="num">${f0(gross)}</td></tr>
    <tr><td>+ Bảo hiểm phần công ty (cột AJ)</td><td class="num">${f0(bh)}</td></tr>
    <tr class="tot"><td>= Chi phí nhân sự kỳ 08/2026</td><td class="num">${f0(gross+bh)}</td></tr>
    <tr><td style="color:var(--muted)">Trong đó thực chuyển cho nhân sự (cột AA)</td><td class="num" style="color:var(--muted)">${f0(DATA.payroll.reduce((s,p)=>s+p.net,0))}</td></tr>
    <tr><td style="color:var(--muted)">Thuế TNCN đã khấu trừ (cột X)</td><td class="num" style="color:var(--muted)">${f0(DATA.payroll.reduce((s,p)=>s+p.pit,0))}</td></tr>
    </tbody></table></div>
    <div style="font-size:11px;color:var(--muted);margin-top:6px">Đây mới là chi phí nhân sự. Net income ở tab 1 <b>chưa</b> gồm chi phí ngoài nhân sự (thuê văn phòng, xe, công cụ, phí ngân hàng…) vì không có trong file này.</div></div>`;
  return h;
}

/* ============================================================
   DETAIL PANEL
   ============================================================ */
function showDetail(type,key){
  sel=type+':'+key;
  const E=effective();
  const d=document.getElementById('detail');
  let ls, title;
  if(type==='person'){ ls=E.lines.filter(l=>l.name===key&&passFilter(l)); title=key; }
  else if(type==='client'||type==='kh'){ ls=E.lines.filter(l=>l.kh===key&&passFilter(l)); title=key; }
  else if(type==='proj'){ ls=E.lines.filter(l=>l.proj===key&&passFilter(l)); title=key; }
  else { ls=E.lines.filter(l=>l.grp===key&&passFilter(l)); title=key; }

  const h=ls.reduce((s,l)=>s+l.h,0), c=ls.reduce((s,l)=>s+l.cost,0);
  const top=[...ls].sort((a,b)=>b.h-a.h).slice(0,8);
  let x=`<div style="font-family:var(--serif);font-size:15px;font-weight:600;color:var(--ink);margin-bottom:2px">${esc(title)}</div>
    <div class="chip">${ls.length} dòng</div><div class="chip">${fh(h)} giờ</div><div class="chip acc">${f0(c)} đ</div>`;
  if(type==='client'||type==='kh'){
    const cc=cfg.clients[key]||{};
    x+=`<div style="margin-top:8px;font-size:11.5px">Mô hình: <b>${{passthrough:'Pass-through',fixed:'Phí trọn gói',internal:'Nội bộ'}[cc.bill]||'—'}</b><br>
      Doanh thu: ${cc.rev?'<b>'+f0(cc.rev)+'</b>':'<span class="miss">⚠️ chưa có nguồn</span>'}<br>
      ${cc.src?'Nguồn: '+esc(cc.src):''}</div>`;
  }
  if(type==='person'){
    const p=PAY[key];
    if(p) x+=`<div style="margin-top:8px;font-size:11.5px">Hình thức: <b>${esc(p.form)}</b> · đơn giá ${f0(p.base)}<br>
      Payroll: giờ ${fh(p.units)} · gross ${f0(p.gross)} · thực nhận ${f0(p.net)}<br>
      Lệch timesheet: <b style="color:${(h-p.units)?'var(--neg)':'inherit'}">${fh(h-(p.units||0))} h</b></div>`;
  }
  x+=`<div style="margin-top:10px" class="flabel">DÒNG TỐN GIỜ NHẤT</div>`;
  top.forEach(l=>{ x+=`<div style="border-top:1px solid var(--line);padding:5px 0;font-size:11.5px">
    <div class="mono" style="font-size:9.5px;color:var(--muted)">${l.date?l.date.split('-').reverse().join('/'):'—'} · ${esc(l.kh)} · ${esc(l.proj)}</div>
    <div>${esc((l.task||'').split('\n')[0].slice(0,110))}</div>
    <div class="mono" style="font-size:10px;color:var(--muted)">${fh(l.h)} h · ${f0(l.cost)} đ · ${esc(l.grp)}</div></div>`; });
  if(!ls.length) x+=`<div style="font-size:11.5px;color:var(--muted)">Không có dòng nào khớp bộ lọc hiện tại.</div>`;
  d.innerHTML=x;
  render();
}

/* ============================================================
   MUTATIONS
   ============================================================ */
function setBill(k,v){ pushUndo(); cfg.clients[k].bill=v; if(v==='internal')cfg.clients[k].rev=null; render(); pill('Đã đổi mô hình tính phí: '+k,'ok'); }
function setRev(k,v){ pushUndo(); cfg.clients[k].rev=(v===''?null:Number(v)); render(); pill(v===''?'Đã xoá doanh thu '+k:'Đã cập nhật doanh thu '+k,'ok'); }
function setSrc(k,v){ pushUndo(); cfg.clients[k].src=v; save(); pill('Đã ghi nguồn chứng từ: '+k,'ok'); }
function setAlloc(n,v){ pushUndo(); cfg.fixedAlloc[n]=v; render(); pill('Đã phân bổ '+n+' → '+(v==='OVERHEAD'?'chi phí chung':v),'ok'); }
function setInc(k,v){ pushUndo(); cfg[k]=v; render();
  pill(k==='allocOverhead'?('Phân bổ chi phí chung: '+(v?'BẬT — lãi lỗ đã gánh đủ':'TẮT — chỉ lãi gộp')):'Đã cập nhật chi phí ngoài lương','ok'); }
function snap(){ const el=document.getElementById('snapName'); const nm=(el.value||'').trim();
  if(!nm){ pill('Đặt tên cho bản lưu trước đã','warn'); el.focus(); return; }
  pushUndo();
  cfg.snaps.unshift({name:nm,at:new Date().toLocaleString('vi-VN'),hash:cfgHash(),
    data:JSON.stringify({clients:cfg.clients,fixedAlloc:cfg.fixedAlloc,basis:cfg.basis,incBhCty:cfg.incBhCty,incAi:cfg.incAi,allocOverhead:cfg.allocOverhead})});
  render(); pill('Đã lưu bản "'+nm+'"','ok'); }
function restoreSnap(i){ const s=cfg.snaps[i];
  if(!confirm('Khôi phục bản "'+s.name+'"?\n\nCấu hình hiện tại sẽ bị thay thế (vẫn undo lại được bằng nút ↩ Undo).\nCác bản lưu khác và file đã export KHÔNG bị ảnh hưởng.'))return;
  pushUndo(); Object.assign(cfg,JSON.parse(s.data)); render(); pill('Đã khôi phục bản "'+s.name+'"','ok'); }
function delSnap(i){ const s=cfg.snaps[i];
  if(!confirm('Xoá bản lưu "'+s.name+'"?\n\nChỉ xoá bản lưu này. Cấu hình đang dùng và file đã export KHÔNG bị ảnh hưởng.'))return;
  pushUndo(); cfg.snaps.splice(i,1); render(); pill('Đã xoá bản lưu','ok'); }
function wipe(){ if(!confirm('Xoá cấu hình đã lưu trên máy này?\n\nMất: doanh thu đã nhập, phân bổ lương cố định, các bản lưu.\nKHÔNG mất: file Excel gốc, các file JSON đã export.'))return;
  try{localStorage.removeItem(LS);}catch(e){} cfg=seedCfg(); undoStack=[]; syncUndo(); render(); pill('Đã xoá cấu hình cục bộ','warn'); }

/* ============================================================
   EXPORT — 2 loại, contract khác nhau
   ============================================================ */
function dl(obj,name){ const b=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click(); URL.revokeObjectURL(a.href); }
const stamp=()=>new Date().toISOString().slice(0,10);

function exportSchema(){
  const P=pnl(), t=P.tot;
  const out={ _contract:'PHANG, chi gom dong hieu luc + P&L da chot. KHONG import nguoc duoc.',
    tool:'omni-payroll-pnl', version:APP_VERSION, period:'08-2026', basis:cfg.basis,
    generated_at:new Date().toISOString(), config_hash:cfgHash(),
    revenue_missing:[...new Set(t.revMissing)],
    pnl_total:{revenue:t.rev,cost_chargeable:t.charge,cost_absorbed:t.absorb,net_income:t.rev-t.charge-t.absorb},
    pnl_by_entity:Object.fromEntries(Object.entries(P.ent).map(([k,v])=>[k,{revenue:v.rev,cost_chargeable:v.charge,cost_absorbed:v.absorb,net_income:v.rev-v.charge-v.absorb}])),
    by_client:Object.entries(P.byClient).map(([k,v])=>({client:k,entity:v.ct,hours:v.h,cost_chargeable:v.charge,cost_absorbed:v.absorb,
      revenue:(cfg.clients[k]||{}).rev??null, billing:(cfg.clients[k]||{}).bill, source:(cfg.clients[k]||{}).src||null})),
    lines:[...P.E.lines,...P.E.fixedLines].map(l=>({date:l.date,person:l.name,client:l.kh,entity:l.ct,project:l.proj,
      task_group:l.grp,hours:l.h,cost:Math.round(l.cost),bucket:l.bucket}))};
  dl(out,'omni_pnl_schema_'+APP_VERSION+'_'+stamp()+'.json');
  pill('Đã xuất Schema — file phẳng, không import ngược được','warn');
}
function exportModel(){
  dl({_contract:'TOAN BO du lieu + cau hinh. IMPORT NGUOC DUOC.',tool:'omni-payroll-pnl',version:APP_VERSION,
      generated_at:new Date().toISOString(),config_hash:cfgHash(),config:cfg,data:DATA},
     'omni_pnl_model_'+APP_VERSION+'_'+stamp()+'.json');
  pill('Đã xuất Full model — khôi phục lại được','ok');
}

/* ============================================================
   FILTER UI
   ============================================================ */
function chkList(el,items,set){
  el.innerHTML=items.map(v=>`<label class="chkline"><input type="checkbox" value="${esc(v)}"${set.has(v)?' checked':''}> ${esc(v)}</label>`).join('');
  el.querySelectorAll('input').forEach(i=>i.onchange=()=>{ i.checked?set.add(i.value):set.delete(i.value); onFilter(); });
}
function onFilter(){ filt.q=document.getElementById('fq').value.trim();
  filt.d1=document.getElementById('fd1').value; filt.d2=document.getElementById('fd2').value; render(); }
function resetFilter(){ filt.q='';filt.people.clear();filt.clients.clear();filt.ent.clear();filt.d1='';filt.d2='';
  document.getElementById('fq').value='';document.getElementById('fd1').value='';document.getElementById('fd2').value='';
  buildFilters(); render(); pill('Đã xoá bộ lọc','ok'); }
function buildFilters(){
  chkList(document.getElementById('fPeople'),NAMES,filt.people);
  chkList(document.getElementById('fClients'),CLIENTS,filt.clients);
  chkList(document.getElementById('fEnt'),ENTS,filt.ent);
}

/* ============================================================
   INIT
   ============================================================ */
document.querySelectorAll('[data-ver]').forEach(e=>e.textContent=APP_VERSION);
document.querySelectorAll('[data-stamp]').forEach(e=>e.textContent=BUILD_STAMP);
document.querySelector('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.tab;render();});
document.getElementById('segBasis').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  pushUndo(); cfg.basis=b.dataset.b; render(); pill('Cơ sở chi phí: '+(cfg.basis==='payroll'?'Payroll':'Timesheet'),'ok');});
document.getElementById('segDim').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  filt.mode=b.dataset.d; document.querySelectorAll('#segDim button').forEach(x=>x.classList.toggle('active',x===b)); render();});
document.getElementById('main').addEventListener('click',e=>{const b=e.target.closest('#sub3 button');if(!b)return;sub3=b.dataset.s;render();});

// resizer
(function(){ const rz=document.getElementById('rz'), lf=document.getElementById('left');
  try{const w=localStorage.getItem(LS+'_w'); if(w)lf.style.width=w+'px';}catch(e){}
  let on=false; rz.addEventListener('mousedown',()=>{on=true;document.body.style.userSelect='none';});
  window.addEventListener('mousemove',e=>{if(!on)return;const x=Math.min(560,Math.max(240,e.clientX));lf.style.width=x+'px';});
  window.addEventListener('mouseup',()=>{if(!on)return;on=false;document.body.style.userSelect='';
    try{localStorage.setItem(LS+'_w',parseInt(lf.style.width));}catch(e){}});
})();

load(); buildFilters(); syncUndo(); render();
</script>
